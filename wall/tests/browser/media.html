<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Local media verification</title
  ><style>
    body {
      font: 15px/1.6 system-ui;
      background: #f5f3ee;
      color: #282c24;
      margin: 40px;
    }
    button {
      padding: 12px;
      margin: 8px;
    }
    pre {
      white-space: pre-wrap;
      max-width: 1000px;
    }
    img {
      width: 320px;
      height: auto;
      background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0/20px 20px;
      vertical-align: top;
      margin: 8px;
    }
    section {
      border-top: 1px solid #ccc;
      padding: 20px 0;
    }
  </style>
  <h1>Local media verification</h1>
  <p>
    Fictional and licensed demo files only. Uses the application's real
    display-copy and ZIP functions. No editor draft is opened.
  </p>
  <button id="run">Run media checks</button
  ><button id="abort">Test cancelled preparation</button>
  <label
    >Fictional artist
    <select id="sample">
      <option value="mara">Mara · Folio</option>
      <option value="sora">Sora · Gallery</option>
      <option value="noor">Noor · Archive</option>
      <option value="ivo">Ivo · Cinema</option>
    </select></label
  ><button id="package">Build fictional website ZIP</button
  ><button id="copy" disabled>Copy ZIP bytes for verification</button>
  <pre id="result" role="status">Ready.</pre>
  <div id="images"></div>
  <script type="module" src="./media.ts"></script>
</html>
