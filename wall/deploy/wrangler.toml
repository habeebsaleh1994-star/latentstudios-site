# Latent Wall: the static files and, beside them, the service (sign-in, the site kept on the server, pictures, publish).
# From wall/, after `node scripts/build-site.mjs`:  npx wrangler@latest deploy -c deploy/wrangler.toml
name = "latent-wall"
main = "../api/worker.js"
compatibility_date = "2026-05-12"
routes = [{ pattern = "wall.latentstudios.art", custom_domain = true }]

[assets]
directory = "../dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "latent-wall"
database_id = "310d72eb-4af9-4b9a-8c4e-800e73e85d9d"

[[r2_buckets]]
binding = "SITES"
bucket_name = "latent-wall-sites"

[vars]
SITE_DOMAIN = "latentstudios.art"
PUBLIC_ORIGIN = "https://wall.latentstudios.art"
# the sender of sign-in mail; the domain must be verified at Resend
MAIL_FROM = "Latent Wall <wall@latentstudios.art>"
# where published sites get their addresses: this account and zone, attached to the sites Worker only (see attach())
CF_ACCOUNT = "243c58f79eeb50c80c1b236d65bd28e6"
CF_ZONE = "1e6064da98698753cd7698acc1dd5162"
SITES_SERVICE = "latent-wall-sites"
# secrets, each set once with `npx wrangler@latest secret put <NAME> -c deploy/wrangler.toml`:
#   RESEND_KEY  the mail service's key (Resend, sending only, latentstudios.art). Without it the door shows the link on the page.
#   CF_TOKEN    a Cloudflare token that may attach Workers to addresses and read the zone's DNS records. Without it Publish
#               says addresses cannot be made yet.
