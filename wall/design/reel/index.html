<style>
/* REEL — a screen in the dark. */
/* the screen */
.reel { max-width: 1500px; margin-inline: auto; padding-inline: var(--gutter); }
.film { margin-block: calc(clamp(72px, 15vh, 180px) * var(--sp)); }
.screen { border: var(--frame); box-shadow: var(--frame-shadow); position: relative; width: min(100%, calc(82vh * var(--r))); aspect-ratio: var(--r); margin-inline: auto; background: #0b090a; overflow: hidden; }
.screen img, .screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: #0b090a; }
.screen video { object-fit: contain; }
.screen .none { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--sans); font-size: 11.5px; letter-spacing: .15em; text-transform: uppercase; color: #8d8386; }
.play { position: absolute; inset: 0; display: grid; place-items: center; border: 0; background: linear-gradient(to top, rgba(0,0,0,.35), transparent 45%); cursor: pointer; color: #F1ECEC; }
.play i { width: 78px; height: 78px; border: 1px solid rgba(241,236,236,.75); border-radius: 50%; display: grid; place-items: center; transition: border-color .4s var(--ease), transform .6s var(--ease); }
.play i::after { content: ""; margin-left: 5px; border-style: solid; border-width: 11px 0 11px 18px; border-color: transparent transparent transparent currentColor; }
.play:hover i, .play:focus-visible i { border-color: var(--peony); transform: scale(1.06); }
.watch { position: absolute; right: 16px; bottom: 14px; font-family: var(--sans); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: #F1ECEC; text-decoration: none; background: rgba(11,9,10,.6); padding: 10px 14px; border: 1px solid rgba(241,236,236,.35); }
.watch:hover { border-color: var(--peony); }
.info { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 22px clamp(28px, 6vw, 96px); width: min(100%, calc(82vh * var(--r))); margin: 28px auto 0; align-items: start; }
.info h2 { font-family: var(--serif); font-weight: var(--title-weight); font-size: clamp(34px, 4.6vw, 62px); line-height: 1.04; letter-spacing: -.02em; margin: 12px 0 0; text-wrap: balance; }
.info .syn { color: var(--ink-soft); font-size: 18px; margin: 0 0 18px; }
.credits { list-style: none; margin: 0; padding: 0; font-family: var(--sans); font-size: 12px; letter-spacing: .05em; color: var(--ink-soft); }
.credits li { padding: 7px 0; border-top: 1px solid var(--rule); }
.stills { display: flex; flex-wrap: wrap; gap: 12px; width: min(100%, calc(82vh * var(--r))); margin: 26px auto 0; }
.stills figure { margin: 0; position: relative; }
.stills img { border-radius: var(--radius); display: block; height: clamp(70px, 9vw, 120px); width: auto; background: var(--silk-deep); cursor: zoom-in; }
[data-editing] .stills img { cursor: default; }
.stills .rm { position: absolute; top: 4px; right: 4px; background: var(--ed-bg); border: 1px solid var(--ed-rule); color: var(--ed-soft); font-family: var(--ed-font); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 8px; cursor: pointer; opacity: 0; }
.stills figure:hover .rm, .stills .rm:focus-visible { opacity: 1; }
@media (hover: none) { .stills .rm { opacity: 1; } }
.film .ptb { width: min(100%, calc(82vh * var(--r))); margin-inline: auto; margin-bottom: 12px; }
.film .addrow.tight { top: calc(clamp(72px, 15vh, 180px) * var(--sp) * -1); }
@media (max-width: 760px) { .info { grid-template-columns: 1fr; } .play i { width: 60px; height: 60px; } }
</style>
