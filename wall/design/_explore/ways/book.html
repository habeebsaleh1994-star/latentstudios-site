<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book · an arrangement study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Instrument+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="ways.css">
<style>
/* BOOK — the series as spreads, turned two pages at a time. Square pages; a plate marked full runs across both. */
body { height: 100dvh; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; }
.stage { min-height: 0; display: grid; place-items: center; padding-inline: var(--gutter); }
.spread { position: relative; width: min(100%, calc((100dvh - 172px) * 2)); aspect-ratio: 2 / 1; container-type: size; display: grid; grid-template-columns: 1fr 1fr; background: var(--page); border: 1px solid var(--rule); transition: opacity .42s var(--ease); }
.spread.turning { opacity: 0; }
.spread::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--rule); pointer-events: none; }
.pg { position: relative; min-width: 0; overflow: hidden; }
.pg figure { position: absolute; inset: 0 5cqw; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pg figure .in { display: flex; flex-direction: column; }
.pg figure img { --h: min(76cqh, 40cqw / var(--r)); height: var(--h); width: calc(var(--h) * var(--r)); }
.pg.wide { grid-column: 1 / -1; }
.pg.wide figure img { --h: min(82cqh, 90cqw / var(--r)); }
.spread:has(.wide)::after { display: none; }
.pg figure .cap { padding-top: 2.4cqh; }
.pg .cap, .pg .cap .n, .pg .cap .d { font-size: clamp(10px, .95cqw, 14px); }
.pg .cap { font-size: clamp(12px, 1.12cqw, 16px); gap: 1.2cqw; }
.pg .foot { position: absolute; right: 5cqw; bottom: 8cqh; left: 5cqw; display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 3cqh; }
.pg .foot .cap { width: min(100%, 24cqw); }
.pg .aside { margin: 0; max-width: 24cqw; font-style: italic; font-weight: 300; font-size: clamp(17px, 2cqw, 30px); line-height: 1.3; text-wrap: balance; }
.pg .say { position: absolute; inset: 0 5cqw; display: flex; align-items: center; }
.pg .say p { margin: 0; max-width: 36cqw; font-weight: 300; font-size: clamp(20px, 2.7cqw, 42px); line-height: 1.22; letter-spacing: -.01em; text-wrap: balance; }
.pg .top { position: absolute; left: 5cqw; top: 9cqh; }
.pg .low { position: absolute; left: 5cqw; right: 5cqw; bottom: 9cqh; }
.pg .low p { margin: 0 0 .7em; max-width: 30cqw; font-size: clamp(13px, 1.3cqw, 19px); line-height: 1.55; color: var(--ink-soft); }
.pg .low p:last-child { margin-bottom: 0; }
.pg h1 { font-size: clamp(34px, 6.6cqw, 104px); }
.pg h2 { margin: 0; font-weight: 300; font-size: clamp(20px, 2.4cqw, 34px); }
.zone { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 2; }
.zone.prev { left: 0; cursor: w-resize; } .zone.next { right: 0; cursor: e-resize; }
.turn { display: flex; justify-content: center; align-items: center; gap: 22px; padding: 14px var(--gutter) 20px; }
.turn button { font-family: var(--sans); font-size: 18px; color: var(--ink-soft); width: 34px; height: 34px; }
.turn button:hover { color: var(--ink); } .turn button[disabled] { opacity: .25; cursor: default; }
.turn .label { min-width: 7em; text-align: center; }

/* On a phone the book is read a page at a time. */
@media (max-width: 700px) {
  .spread { grid-template-columns: 1fr; aspect-ratio: 3 / 4; width: min(100%, calc((100dvh - 172px) * .75)); }
  .spread::after { display: none; }
  .pg figure { inset: 0 7cqw; justify-content: center; }
  .pg figure img { --h: min(74cqh, 86cqw / var(--r)); }
  .pg .cap { font-size: 14px; gap: 14px; } .pg .cap .n, .pg .cap .d { font-size: 10.5px; }
  .pg .aside { font-size: 16px; max-width: none; padding-top: 14px; }
  .pg .say { inset: 0 8cqw; } .pg .say p { max-width: none; font-size: 25px; }
  .pg .top { left: 8cqw; top: 8cqw; } .pg .low { left: 8cqw; right: 8cqw; bottom: 8cqw; } .pg .low p { max-width: none; font-size: 15.5px; }
  .pg h1 { font-size: 15cqw; margin-bottom: 18px; } .pg h2 { font-size: 24px; margin-bottom: 14px; }
}
@media (prefers-reduced-motion: reduce) { .spread { transition: none; } }
</style>
</head>
<body>
<header class="bar"><a class="name" href="#1">Habib Saleh</a><nav aria-label="Primary"><a href="#1">Work</a><a href="#last">About</a><a href="#last">Contact</a></nav></header>
<main class="stage"><div class="spread" id="spread" aria-live="polite"></div></main>
<footer class="turn"><button id="prev" aria-label="Previous page">&#8249;</button><span class="label" id="count"></span><button id="next" aria-label="Next page">&#8250;</button></footer>

<script src="data.js"></script>
<script>
(function () {
  var S = window.SERIES, esc = S.esc, el = document.getElementById("spread"), count = document.getElementById("count");
  var phone = window.matchMedia("(max-width: 700px)"), leaves = [], at = 0;

  function cap(w) { return '<p class="cap"><span class="n">' + w.n + "</span><span>" + esc(w.title) + '</span><span class="d">' + esc(w.date) + "</span></p>"; }
  function img(w) { return '<img src="' + w.src + '" alt="' + esc(w.alt) + '" style="--r:' + w.r + '">'; }
  function plate(w, extra) { return '<figure><div class="in">' + img(w) + cap(w) + (extra || "") + "</div></figure>"; }
  function bare(w) { return '<figure><div class="in">' + img(w) + "</div></figure>"; }
  function pg(html, cls) { return '<div class="pg ' + (cls || "") + '">' + html + "</div>"; }
  var title = '<div class="top"><span class="label">' + esc(S.kicker) + "</span></div>", h1 = "<h1>" + esc(S.title) + " <em>" + esc(S.titleEm) + "</em></h1>";
  var about = S.about.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + '<p class="label" style="margin-top:1.6em">' + esc(S.contact) + "</p>";

  function build() {
    var out = [], one = phone.matches;
    if (one) out.push(pg(title + '<div class="low">' + h1 + "<p>" + esc(S.note) + "</p></div>"));
    else out.push(pg(title + '<div class="low"><p>' + esc(S.note) + "</p></div>") + pg('<div class="low">' + h1 + "</div>"));
    S.groups.forEach(function (g) {
      var a = g.works && g.works[0];
      if (g.type === "pause") out.push(one ? pg('<div class="top"><span class="label">' + esc(g.label) + '</span></div><div class="say"><p>' + esc(g.text) + "</p></div>") : pg('<div class="foot"><span class="label">' + esc(g.label) + "</span></div>") + pg('<div class="say"><p>' + esc(g.text) + "</p></div>"));
      else if (g.type === "pair") { if (one) g.works.forEach(function (w) { out.push(pg(plate(w))); }); else out.push(pg(plate(a)) + pg(plate(g.works[1]))); }
      else if (a.full && !one) out.push(pg(plate(a), "wide"));
      else if (one) out.push(pg(plate(a, g.note ? '<p class="aside">' + esc(g.note) + "</p>" : "")));
      else out.push(pg('<div class="foot">' + (g.note ? '<p class="aside">' + esc(g.note) + "</p>" : "") + cap(a) + "</div>") + pg(bare(a)));
    });
    out.push(one ? pg('<div class="low"><h2>' + esc(S.aboutTitle) + "</h2>" + about + "</div>") : pg('<div class="low"><h2>' + esc(S.aboutTitle) + "</h2></div>") + pg('<div class="low">' + about + "</div>"));
    leaves = out;
  }
  function show(i, quick) {
    at = Math.max(0, Math.min(leaves.length - 1, i));
    function put() {
      el.innerHTML = leaves[at] + '<button class="zone prev" tabindex="-1" aria-hidden="true"></button><button class="zone next" tabindex="-1" aria-hidden="true"></button>';
      count.textContent = (at + 1) + " / " + leaves.length;
      document.getElementById("prev").disabled = at === 0; document.getElementById("next").disabled = at === leaves.length - 1;
      el.classList.remove("turning");
    }
    if (quick) return put();
    el.classList.add("turning"); setTimeout(put, 300);
  }
  function go(d) { if (at + d >= 0 && at + d < leaves.length) show(at + d); }
  function fromHash() { var h = location.hash.slice(1); return h === "last" ? leaves.length - 1 : Math.max(0, (parseInt(h, 10) || 1) - 1); }

  el.addEventListener("click", function (e) { var z = e.target.closest(".zone"); if (z) go(z.classList.contains("next") ? 1 : -1); });
  document.getElementById("prev").onclick = function () { go(-1); }; document.getElementById("next").onclick = function () { go(1); };
  document.addEventListener("keydown", function (e) { if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") go(1); if (e.key === "ArrowLeft" || e.key === "PageUp") go(-1); });
  var x0 = null;
  el.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  el.addEventListener("touchend", function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); });
  window.addEventListener("hashchange", function () { show(fromHash()); });
  phone.addEventListener("change", function () { build(); show(0, true); });
  build(); show(fromHash(), true);
  S.works.forEach(function (w) { new Image().src = w.src; });
})();
</script>
</body>
</html>
