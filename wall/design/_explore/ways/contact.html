<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact · an arrangement study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Instrument+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="ways.css">
<style>
/* CONTACT — the whole series at a glance, every frame in an equal cell and in order; choose one and it is held large. */
.head { max-width: 1500px; margin-inline: auto; padding: clamp(10px, 3vh, 36px) var(--gutter) clamp(28px, 5vh, 52px); display: grid; grid-template-columns: 1fr minmax(0, 330px); gap: 18px 64px; align-items: end; }
.head h1 { font-size: clamp(38px, 5vw, 72px); margin-top: 14px; }
.head p { margin: 0 0 4px; font-size: 16.5px; line-height: 1.55; color: var(--ink-soft); }
.sheet { list-style: none; margin: 0 auto; padding: 0 var(--gutter); max-width: 1500px; display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(22px, 2.6vw, 38px) clamp(12px, 1.5vw, 22px); }
.cell { display: block; width: 100%; text-align: left; }
.cell .fr { display: block; aspect-ratio: 3 / 2; background: var(--silk-deep); }
.cell img { width: 100%; height: 100%; object-fit: contain; transition: opacity .5s var(--ease); }
.cell .cap { padding-top: 10px; font-size: 14.5px; gap: 12px; }
.cell .cap span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: hover) { .sheet:hover .cell:not(:hover) img { opacity: .55; } }
.epi { max-width: 1500px; margin: clamp(48px, 9vh, 100px) auto 0; padding-inline: var(--gutter); }
.epi p { margin: 14px 0 0; max-width: 21em; font-weight: 300; font-size: clamp(24px, 2.8vw, 38px); line-height: 1.24; letter-spacing: -.01em; text-wrap: balance; }
.about { border-top: 1px solid var(--rule); margin-top: clamp(64px, 12vh, 140px); padding: clamp(40px, 8vh, 84px) var(--gutter) 40px; }
.about-in { max-width: 1500px; margin-inline: auto; display: grid; grid-template-columns: 1fr minmax(0, 560px); gap: 30px 64px; }
.about h2 { margin: 0; font-weight: 300; font-size: 30px; } .about p { margin: 0 0 1em; font-size: 18px; color: var(--ink-soft); }
@media (max-width: 1000px) { .sheet { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 760px) { .head, .about-in { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .sheet { grid-template-columns: repeat(2, 1fr); gap: 22px 10px; } .cell .cap { font-size: 13px; gap: 8px; } .cell .cap .n { min-width: 0; } }

/* Held: one work (or a pair that belongs together) large, with the sheet kept beneath as a thin strip. */
.held { position: fixed; inset: 0; z-index: 5; background: var(--silk); display: grid; grid-template-rows: auto 1fr auto; opacity: 0; visibility: hidden; transition: opacity .45s var(--ease), visibility 0s .45s; }
.held.on { opacity: 1; visibility: visible; transition: opacity .45s var(--ease); }
.held .top { display: flex; justify-content: space-between; align-items: baseline; padding: 28px var(--gutter) 10px; }
.held .top button { font-family: var(--sans); font-size: 11.5px; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-soft); }
.held .top button:hover { color: var(--ink); }
.held .mid { min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; gap: clamp(16px, 3vw, 48px); padding-inline: var(--gutter); transition: opacity .3s var(--ease); }
.held .mid.swap { opacity: 0; }
.held figure { margin: 0; --h: min(var(--hmax), calc(var(--wmax) / var(--r))); }
.held .one figure { --hmax: calc(100dvh - 270px); --wmax: calc(100vw - 2 * var(--gutter)); }
.held .two figure { --hmax: calc(100dvh - 270px); --wmax: calc((100vw - 2 * var(--gutter) - 48px) / 2); }
.held figure img { height: var(--h); width: calc(var(--h) * var(--r)); background: var(--silk-deep); }
.held figure .cap { padding-top: 14px; }
.held figure .aside { margin: 8px 0 0; font-style: italic; font-size: 15px; color: var(--ink-soft); }
.held .say { max-width: 15em; font-weight: 300; font-size: clamp(26px, 3.5vw, 46px); line-height: 1.22; letter-spacing: -.01em; text-wrap: balance; }
.held .say .label { display: block; margin-bottom: 20px; }
.held .zone { position: absolute; top: 0; bottom: 0; width: 50%; } .held .zone.prev { left: 0; cursor: w-resize; } .held .zone.next { right: 0; cursor: e-resize; }
.held figure, .held .say { position: relative; z-index: 1; pointer-events: none; }
.strip { display: flex; justify-content: center; gap: 6px; padding: 16px var(--gutter) 26px; }
.strip button { height: 30px; width: 45px; padding: 0 0 6px; box-sizing: content-box; border-bottom: 2px solid transparent; opacity: .45; transition: opacity .3s; }
.strip button img { width: 100%; height: 100%; object-fit: contain; }
.strip button:hover { opacity: .8; } .strip button.on { opacity: 1; border-bottom-color: var(--ink); }
@media (max-width: 700px) {
  .held .mid.two { flex-direction: column; gap: 18px; }
  .held .two figure { --hmax: calc((100dvh - 330px) / 2); --wmax: calc(100vw - 2 * var(--gutter)); }
  .held .one figure { --hmax: calc(100dvh - 300px); }
  .strip { gap: 3px; } .strip button { width: calc((100vw - 2 * var(--gutter) - 33px) / 12); height: 22px; }
}
@media (prefers-reduced-motion: reduce) { .held, .held .mid, .cell img { transition: none; } }
</style>
</head>
<body>
<header class="bar"><a class="name" href="#top">Habib Saleh</a><nav aria-label="Primary"><a href="#work">Work</a><a href="#about">About</a><a href="#about">Contact</a></nav></header>
<main id="top"></main>
<div class="held" id="held" role="dialog" aria-modal="true" aria-label="One work, held large">
  <div class="top"><button id="back">&larr; The sheet</button><span class="label" id="where"></span></div>
  <div class="mid" id="mid"></div>
  <div class="strip" id="strip"></div>
</div>

<script src="data.js"></script>
<script>
(function () {
  var S = window.SERIES, esc = S.esc, G = S.groups, held = document.getElementById("held"), mid = document.getElementById("mid"), strip = document.getElementById("strip"), where = document.getElementById("where");
  var pause = G.filter(function (g) { return g.type === "pause"; })[0], at = 0, lastFocus = null;
  function capHtml(w, date) { return '<span class="cap"><span class="n">' + w.n + "</span><span>" + esc(w.title) + "</span>" + (date ? '<span class="d">' + esc(w.date) + "</span>" : "") + "</span>"; }

  document.getElementById("top").innerHTML =
    '<section class="head"><div><span class="label">' + esc(S.kicker) + "</span><h1>" + esc(S.title) + " <em>" + esc(S.titleEm) + "</em></h1></div><p>" + esc(S.note) + "</p></section>" +
    '<ol class="sheet" id="work">' + S.works.map(function (w) { return '<li><button class="cell" data-i="' + w.i + '" aria-label="' + w.n + ", " + esc(w.title) + '"><span class="fr"><img src="' + w.src + '" alt="' + esc(w.alt) + '" loading="lazy"></span>' + capHtml(w) + "</button></li>"; }).join("") + "</ol>" +
    (pause ? '<section class="epi"><span class="label">' + esc(pause.label) + "</span><p>" + esc(pause.text) + "</p></section>" : "") +
    '<section class="about" id="about"><div class="about-in"><h2>' + esc(S.aboutTitle) + "</h2><div>" + S.about.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + '<span class="label">' + esc(S.contact) + "</span></div></div></section>";
  strip.innerHTML = S.works.map(function (w) { return '<button data-i="' + w.i + '" aria-label="' + w.n + ", " + esc(w.title) + '"><img src="' + w.src + '" alt=""></button>'; }).join("");

  function fig(w, aside) { return '<figure style="--r:' + w.r + '"><img src="' + w.src + '" alt="' + esc(w.alt) + '"><figcaption>' + capHtml(w, true) + (aside ? '<p class="aside">' + esc(aside) + "</p>" : "") + "</figcaption></figure>"; }
  function put() {
    var g = G[at], zones = '<button class="zone prev" tabindex="-1" aria-label="Previous"></button><button class="zone next" tabindex="-1" aria-label="Next"></button>';
    mid.className = "mid " + (g.type === "pair" ? "two" : "one");
    mid.innerHTML = zones + (g.type === "pause" ? '<p class="say"><span class="label">' + esc(g.label) + "</span>" + esc(g.text) + "</p>" : g.works.map(function (w) { return fig(w, g.note); }).join(""));
    var on = (g.works || []).map(function (w) { return w.i; });
    [].forEach.call(strip.children, function (b, i) { b.classList.toggle("on", on.indexOf(i) > -1); });
    where.textContent = g.works ? g.works.map(function (w) { return w.n; }).join(" – ") + " / " + S.works.length : "";
  }
  function show(i, quick) { at = (i + G.length) % G.length; if (quick) return put(); mid.classList.add("swap"); setTimeout(put, 240); }
  function groupOf(i) { for (var k = 0; k < G.length; k++) if (G[k].works && G[k].works.some(function (w) { return w.i === i; })) return k; return 0; }
  function open(i) { lastFocus = document.activeElement; show(groupOf(i), true); held.classList.add("on"); document.documentElement.style.overflow = "hidden"; document.getElementById("back").focus({ preventScroll: true }); }
  function close() { held.classList.remove("on"); document.documentElement.style.overflow = ""; if (lastFocus) lastFocus.focus({ preventScroll: true }); }

  document.getElementById("work").addEventListener("click", function (e) { var c = e.target.closest(".cell"); if (c) open(+c.dataset.i); });
  strip.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) show(groupOf(+b.dataset.i)); });
  mid.addEventListener("click", function (e) { var z = e.target.closest(".zone"); if (z) show(at + (z.classList.contains("next") ? 1 : -1)); });
  document.getElementById("back").onclick = close;
  document.addEventListener("keydown", function (e) { if (!held.classList.contains("on")) return; if (e.key === "Escape") close(); if (e.key === "ArrowRight") show(at + 1); if (e.key === "ArrowLeft") show(at - 1); });
  var x0 = null;
  mid.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  mid.addEventListener("touchend", function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) show(at + (dx < 0 ? 1 : -1)); });
  /* #open=4 starts with work 4 held (used by the study board). */
  var m = /^#open=(\d+)$/.exec(location.hash); if (m) open(m[1] - 1);
})();
</script>
</body>
</html>
