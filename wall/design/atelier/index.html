<head>

<style>
/* ATELIER — projects with their process and outcome side by side. */
/* the studio's disciplines, then each project: words and facts first, then process beside outcome */
.studio { max-width: 1500px; margin-inline: auto; padding-inline: var(--gutter); }
.kinds { display: flex; flex-wrap: wrap; gap: 8px 30px; padding-block: 0 clamp(36px, 7vh, 80px); border-bottom: 1px solid var(--rule); font-family: var(--sans); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.kinds a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; } .kinds a:hover { color: var(--ink); border-color: var(--peony); }
.proj { padding-block: calc(clamp(64px, 12vh, 150px) * var(--sp)); border-bottom: 1px solid var(--rule); }
.ph { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 24px clamp(28px, 6vw, 96px); align-items: start; margin-bottom: clamp(32px, 6vh, 72px); }
.ph h2 { font-family: var(--serif); font-weight: var(--title-weight); font-size: clamp(38px, 5.4vw, 78px); line-height: 1; letter-spacing: -.02em; margin: 14px 0 0; text-wrap: balance; }
.ph .sum { color: var(--ink-soft); font-size: 19px; margin: 0 0 22px; max-width: 34em; }
.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0 22px; font-size: 15px; }
.facts dt { font-family: var(--sans); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); padding: 9px 0; border-top: 1px solid var(--rule); }
.facts dd { margin: 0; padding: 7px 0; border-top: 1px solid var(--rule); color: var(--ink); }
.cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(28px, 5vw, 80px); align-items: stretch; }
.more { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: clamp(22px, 3vw, 44px); margin-top: clamp(36px, 6vh, 72px); }
.col-h { font-family: var(--sans); font-size: 11.5px; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 18px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.steps { display: grid; gap: clamp(30px, 5vh, 56px); }
.outcome { position: sticky; top: 24px; }
.fig { margin: 0; position: relative; }
.fig .frame { border: var(--frame); box-shadow: var(--frame-shadow); }
.fig .frame img { display: block; width: 100%; height: auto; background: var(--silk-deep); border-radius: var(--radius); }
[data-mount="line"] .fig .frame { outline: 1px solid var(--rule); outline-offset: 6px; }
[data-mount="matte"] .fig .frame { background: var(--silk-deep); padding: clamp(10px, 2vw, 28px); } [data-mount="matte"] .fig .frame img { background: transparent; }
.fig figcaption { display: grid; grid-template-columns: 2.4em 1fr; gap: 0 6px; padding-top: 12px; font-size: 15px; color: var(--ink-soft); font-style: normal; }
.fig figcaption .n { font-family: var(--sans); font-size: 11.5px; letter-spacing: .12em; color: var(--ink); padding-top: 4px; }
.fig figcaption b { font-weight: 400; font-style: italic; color: var(--ink); }
.cmp { margin-top: clamp(36px, 6vh, 72px); }
.compare { position: relative; aspect-ratio: var(--cr, 4 / 3); overflow: hidden; background: var(--silk-deep); touch-action: pan-y; cursor: ew-resize; user-select: none; --cut: 50%; }
.compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.compare .over { clip-path: inset(0 calc(100% - var(--cut)) 0 0); }
.compare .knob { position: absolute; top: 0; bottom: 0; left: var(--cut); width: 2px; background: var(--silk); transform: translateX(-1px); pointer-events: none; }
.compare .knob::after { content: "\2194"; position: absolute; top: 50%; left: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: var(--silk); color: var(--ink); display: grid; place-items: center; font-size: 18px; }
.compare input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
.compare input:focus-visible ~ .knob::after { outline: 2px solid var(--peony); outline-offset: 3px; }
.compare .tag { position: absolute; bottom: 14px; font-family: var(--sans); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); background: color-mix(in srgb, var(--silk) 85%, transparent); padding: 8px 12px; pointer-events: none; }
.compare .tag.l { left: 14px; } .compare .tag.r { right: 14px; }
.voice { padding-block: clamp(56px, 10vh, 120px); }
.principles { list-style: none; margin: 0; padding: 0; counter-reset: p; }
.principles li { counter-increment: p; display: grid; grid-template-columns: 3.2em 1fr; padding: clamp(18px, 3vh, 30px) 0; border-top: 1px solid var(--rule); font-family: var(--serif); font-weight: var(--title-weight); font-size: clamp(26px, 3.6vw, 48px); line-height: 1.12; letter-spacing: -.01em; }
.principles li::before { content: counter(p); font-family: var(--sans); font-size: 12px; letter-spacing: .14em; color: var(--peony-text); padding-top: .9em; }
.principles li:last-child { border-bottom: 1px solid var(--rule); }
.voice .intro p { color: var(--ink-soft); font-size: 20px; max-width: 36em; }
.proj .ptb { margin: 0 0 22px; }
.link-btn { background: none; border: 0; border-bottom: 1px solid var(--ed-rule); font-family: var(--ed-font); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ed-soft); padding: 4px 0; cursor: pointer; } .link-btn:hover { color: var(--ed-ink); border-color: var(--ed-accent); }
.facts-edit { font-size: 15px; white-space: pre-line; }
.fig .tb { top: 10px; right: 10px; }
@media (hover: none) { .fig .tb { opacity: 1; } }
@media (max-width: 860px) { .ph, .cols { grid-template-columns: 1fr; } .col-out { order: -1; } .outcome { position: static; } .cols { gap: 44px; } }
</style>
