<style>
/* LANTERN: one slide at a time, like a lantern show. A title slide first, then each picture held in the middle of the screen. */
.show { padding-inline: var(--gutter); max-width: 1500px; margin-inline: auto; }
.stage { position: relative; display: grid; place-items: center; min-height: calc(100svh - 250px); padding-block: calc(8px * var(--sp)); }
.slide { width: 100%; display: grid; justify-items: center; gap: 0; }
.slide figure { margin: 0; display: grid; justify-items: center; max-width: 100%; }
.frame { display: inline-block; max-width: 100%; background: transparent; border: var(--frame); box-shadow: var(--frame-shadow); position: relative; }
.frame img { width: auto; max-width: 100%; max-height: calc(100svh - 330px); min-height: 160px; object-fit: contain; background: var(--silk-deep); border-radius: var(--radius); }
[data-opt-stage="full"] .frame img { max-height: calc(100svh - 270px); }
[data-mount="line"] .frame { outline: 1px solid var(--rule); outline-offset: clamp(8px, 1.2vw, 16px); }
[data-mount="matte"] .frame { background: var(--silk-deep); padding: clamp(14px, 3vw, 44px); }
[data-mount="matte"] .frame img { background: transparent; }
figcaption { display: flex; gap: 18px; align-items: baseline; justify-content: center; padding-top: calc(14px + clamp(8px, 1.2vw, 16px) * 0); font-size: 15px; color: var(--ink-soft); font-style: italic; }
[data-mount="line"] figcaption { padding-top: calc(14px + clamp(8px, 1.2vw, 16px)); }
figcaption .n { font-family: var(--sans); font-style: normal; font-size: var(--label-size); letter-spacing: var(--label-track); color: var(--ink); }
figcaption .d { font-family: var(--sans); font-style: normal; font-size: var(--label-size); letter-spacing: var(--label-track); text-transform: var(--label-case); white-space: nowrap; }
.slide.words { max-width: 760px; text-align: center; }
.slide.words p { font-family: var(--serif); font-weight: var(--title-weight); font-size: clamp(24px, 3.2vw, 42px); line-height: 1.24; letter-spacing: -.01em; margin: 18px 0 0; text-wrap: balance; }
.slide.title { max-width: 900px; justify-items: start; }
.slide.title .card { padding-inline: 0; grid-template-columns: 1fr; }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-soft); font: 300 30px/1 var(--serif); cursor: pointer; display: grid; place-items: center; }
.arrow:hover:not(:disabled) { color: var(--ink); background: var(--silk-deep); }
.arrow:disabled { opacity: .25; cursor: default; }
.arrow.prev { left: -8px; } .arrow.next { right: -8px; }
@media (max-width: 760px) { .arrow { top: auto; bottom: -4px; transform: none; } .arrow.prev { left: 0; } .arrow.next { right: 0; } .stage { padding-bottom: 52px; } }
.thumbs { display: flex; gap: 10px; overflow-x: auto; justify-content: safe center; padding: 18px 2px 6px; scrollbar-width: thin; }
.thumbs > button { flex: none; border: 0; padding: 0; background: none; cursor: pointer; opacity: .55; transition: opacity .3s var(--ease); outline-offset: 3px; }
.thumbs > button:hover, .thumbs > button[aria-current="true"] { opacity: 1; }
.thumbs > button[aria-current="true"] { outline: 1px solid var(--peony); }
.thumbs img { height: 54px; width: auto; max-width: 96px; object-fit: cover; }
.thumbs .t0 { font-family: var(--sans); font-size: var(--label-size); letter-spacing: var(--label-track); text-transform: var(--label-case); color: var(--ink-soft); height: 54px; padding-inline: 12px; display: grid; place-items: center; }
[data-opt-thumbs="none"] .thumbs { display: none; }
.slide.fade { animation: lant-in .6s var(--ease) both; }
[data-motion="still"] .slide.fade { animation: none; }
@keyframes lant-in { from { opacity: 0; } to { opacity: 1; } }
</style>
