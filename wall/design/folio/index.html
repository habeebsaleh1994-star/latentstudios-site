<style>
/* FOLIO — one work at a time, held large and still. */
.seq { padding-inline: var(--gutter); max-width: 1500px; margin-inline: auto; }
.seq > .work:first-child { margin-top: 0; }
.work { margin-block: calc(clamp(64px, 15vh, 190px) * var(--sp)); }
figure { margin: 0; }
.single figure { width: min(100%, calc(82vh * var(--r)), 1260px); margin-inline: auto; }
.frame { background: transparent; border: var(--frame); box-shadow: var(--frame-shadow); }
.frame img { background: var(--silk-deep); border-radius: var(--radius); }
[data-mount="line"] .frame { outline: 1px solid var(--rule); outline-offset: clamp(8px, 1.2vw, 16px); }
[data-mount="line"] figcaption { padding-top: calc(14px + clamp(8px, 1.2vw, 16px)); }
[data-mount="matte"] .frame { background: var(--silk-deep); padding: clamp(14px, 3.4vw, 52px); }
[data-mount="matte"] .frame img { background: transparent; }
figcaption { display: flex; gap: 18px; align-items: baseline; padding-top: 14px; font-size: 15px; color: var(--ink-soft); font-style: italic; }
[data-type="atelier"] figcaption span:not(.n):not(.d) { font-style: normal; }
figcaption .n { font-family: var(--sans); font-style: normal; font-size: var(--label-size); letter-spacing: var(--label-track); color: var(--ink); min-width: 3.2em; }
figcaption .d { font-family: var(--sans); font-style: normal; font-size: var(--label-size); letter-spacing: var(--label-track); text-transform: var(--label-case); margin-left: auto; white-space: nowrap; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(20px, 4vw, 64px); align-items: start; }
@media (max-width: 760px) { .pair { grid-template-columns: 1fr; gap: 64px; } }
.split { display: grid; grid-template-columns: 1fr minmax(0, calc(84vh * var(--r))) 1fr; gap: clamp(20px, 4vw, 64px); align-items: end; justify-content: center; }
.split .side { padding-bottom: 6px; max-width: 260px; }
.split .side p { font-size: 15px; color: var(--ink-soft); font-style: italic; margin: 0 0 6px; }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } .split .side { max-width: none; order: 2; } .split .side:last-child { display: none; } }

.interlude { margin-block: calc(clamp(96px, 22vh, 260px) * var(--sp)); display: grid; grid-template-columns: repeat(12, 1fr); gap: 0 20px; }
.interlude p { font-family: var(--serif); grid-column: 3 / span 6; margin: 0; font-weight: var(--title-weight); font-size: clamp(26px, 3.5vw, 46px); line-height: 1.22; letter-spacing: -.01em; text-wrap: balance; }
.interlude .label { grid-column: 3 / span 6; margin-bottom: 22px; }
@media (max-width: 860px) { .interlude p, .interlude .label { grid-column: 1 / -1; } }
</style>
