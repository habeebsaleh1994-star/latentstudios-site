<style>
/* SALON — many works hung together at their real relative scale. */
/* the hang: works share one wall, centred on a common eye line, all at one scale (--k pixels per centimetre) */
.salon { padding-inline: var(--gutter); max-width: 1500px; margin-inline: auto; --k: .4; }
.wall { display: flex; align-items: center; justify-content: center; gap: calc(14 * var(--k) * 1px); background: var(--silk-deep); padding: calc(46 * var(--k) * 1px) calc(36 * var(--k) * 1px); }
.art { margin: 0; width: calc(var(--cw) * var(--k) * 1px); flex: none; position: relative; }
.art .frame { border: var(--frame); box-shadow: var(--frame-shadow); }
.art .frame img { display: block; width: 100%; height: auto; background: var(--silk); cursor: zoom-in; border-radius: var(--radius); }
[data-editing] .art .frame img { cursor: default; }
[data-mount="line"] .art .frame { outline: 1px solid var(--rule); outline-offset: 4px; }
[data-mount="matte"] .art .frame { background: var(--silk); padding: calc(5 * var(--k) * 1px); }
.art .no { position: absolute; left: 0; top: calc(100% + 8px); font-family: var(--sans); font-size: 11px; letter-spacing: .12em; color: var(--ink-soft); }
.hang { margin-block: calc(clamp(40px, 9vh, 110px) * var(--sp)); }
.key { list-style: none; margin: 26px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px 40px; font-size: 15px; color: var(--ink-soft); }
.key li { display: grid; grid-template-columns: 2.2em 1fr; }
.key .k { font-family: var(--sans); font-size: 11px; letter-spacing: .12em; color: var(--ink); padding-top: 4px; }
.key b { font-weight: 400; color: var(--ink); font-style: italic; }
.key .sz { font-family: var(--sans); font-size: 11.5px; letter-spacing: .06em; white-space: nowrap; }
.art .cap { display: none; font-size: 14px; color: var(--ink-soft); padding-top: 4px; }
@media (max-width: 760px) {
  .wall { flex-direction: column; background: none; padding: 0; gap: 54px; }
  .art { width: calc(var(--cw) / var(--maxcm) * 100%); }
  .art .no { position: static; display: block; padding-top: 8px; }
  .hang { margin-block: 56px; }
  .key { display: none; }
  .art .cap { display: block; }
}
</style>
