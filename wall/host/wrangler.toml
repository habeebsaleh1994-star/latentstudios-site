# Latent Wall sites: one Worker, one bucket. Deploy with `npx wrangler deploy` from this folder.
name = "latent-wall-sites"
main = "worker.js"
compatibility_date = "2026-05-12"
workers_dev = false

# No catch-all route, ever: the studio's other services live under latentstudios.art too, each on its own address,
# and a wildcard here would stand in front of them. Each published site's address is attached to this Worker by Wall
# when the site is first published, and let go when it is taken down. The two below were made by hand before that.
routes = [
  { pattern = "habib.latentstudios.art", custom_domain = true },
  { pattern = "maddalena.latentstudios.art", custom_domain = true },
]

[[r2_buckets]]
binding = "SITES"
bucket_name = "latent-wall-sites"

[vars]
# hosts that carry the site name in the path instead of a subdomain (comma-separated); leave empty for subdomains only
BARE_HOSTS = ""


