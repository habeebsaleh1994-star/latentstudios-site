# Latent Wall sites: one Worker, one bucket. Deploy with `npx wrangler deploy` from this folder.
name = "latent-wall-sites"
main = "worker.js"
compatibility_date = "2026-05-12"

[[r2_buckets]]
binding = "SITES"
bucket_name = "latent-wall-sites"

[vars]
# hosts that carry the site name in the path instead of a subdomain (comma-separated); leave empty for subdomains only
BARE_HOSTS = ""

# routes are added once the domain is decided, e.g.
# routes = [{ pattern = "*.latentstudios.art/*", zone_name = "latentstudios.art" }]
