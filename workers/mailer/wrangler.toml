name = "latent-mailer"
main = "src/index.js"
compatibility_date = "2026-05-12"
# Reached only through the site's service binding: no workers.dev address, no preview address.
workers_dev = false
preview_urls = false

[[send_email]]
name = "EMAIL"

# Workers Logs: on for every live server (15 Oct 2026), so a failure can always be read in the dashboard.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
